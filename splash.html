<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SastraGetWay</title>
  <style>
    @font-face {
      font-family: 'Khmer OS Siemreap';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('./fonts/KhmerOSSiemreap.ttf') format('truetype'),
           url('./fonts/!KhmerOSSiemreap.ttf') format('truetype'),
           url('./KhmerOSSiemreap.ttf') format('truetype'),
           url('./!KhmerOSSiemreap.ttf') format('truetype'),
           local('!Khmer OS Siemreap'),
           local('Khmer OS Siemreap'),
           local('KhmerOSSiemreap');
    }
    @font-face {
      font-family: '!Khmer OS Siemreap';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('./fonts/KhmerOSSiemreap.ttf') format('truetype'),
           url('./fonts/!KhmerOSSiemreap.ttf') format('truetype'),
           url('./KhmerOSSiemreap.ttf') format('truetype'),
           url('./!KhmerOSSiemreap.ttf') format('truetype'),
           local('!Khmer OS Siemreap'),
           local('Khmer OS Siemreap'),
           local('KhmerOSSiemreap');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Khmer OS Siemreap', '!Khmer OS Siemreap', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: 'Khmer OS Siemreap', '!Khmer OS Siemreap', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    .container {
      text-align: center;
      padding: 40px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-box {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(59, 130, 246, 0.15));
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
    }
    .logo-box img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #71717a;
      margin-bottom: 28px;
      font-weight: 400;
    }
    .spinner-bar {
      width: 220px;
      height: 4px;
      background: #18181b;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .spinner-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, #06b6d4, transparent);
      animation: indeterminate 1.5s infinite ease-in-out;
      border-radius: 99px;
    }
    @keyframes indeterminate {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    .status-text {
      font-size: 12px;
      color: #a1a1aa;
      font-family: monospace;
    }
    .port-badge {
      display: inline-block;
      margin-top: 18px;
      font-size: 11px;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 3px 10px;
      border-radius: 99px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <img src="assets/icon.png" alt="SastraGetWay Logo">
    </div>
    <h1 class="title">SastraGetWay</h1>
    <p class="subtitle">Neural AI Engine & Local Gateway</p>
    
    <div class="spinner-bar">
      <div class="spinner-fill"></div>
    </div>
    <div class="status-text" id="status">Booting local router engine...</div>
    <div class="port-badge">http://127.0.0.1:20128</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const steps = [
      'Booting local router engine...',
      'Initializing database & auth stores...',
      'Binding port 127.0.0.1:20128...',
      'Launching SastraGetWay dashboard...'
    ];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % steps.length;
      statusEl.textContent = steps[i];
    }, 600);
  </script>
</body>
</html>
